name: Update PubMed catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch PubMed records
        env:
          NCBI_TOOL: internal-medicine-review-hub
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/update_pubmed.py --years 10 --limit 25
      - name: Commit updated catalog
        run: |
          if ! git diff --quiet -- data/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Update PubMed catalog"
            git push
          fi
